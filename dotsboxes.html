<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dots & Boxes</title>

  <link rel="stylesheet" href="dotsboxes.css">
</head>

<body>

  <div class="game-layout">

    <!-- ===================== SETUP ===================== -->

    <main id="setup-screen" class="screen">

      <section class="setup-card">

        <p class="eyebrow">
          Classic board game
        </p>

        <h1 class="title">
          Dots & Boxes
        </h1>

        <!-- COLOR -->

        <div class="setup-section">

          <h2 class="section-label">
            Choose your color
          </h2>

          <div class="option-row">

            <button
              class="option-btn color-option"
              data-color="blue"
              type="button"
            >
              <span class="option-swatch swatch-blue"></span>
              Blue
            </button>

            <button
              class="option-btn color-option"
              data-color="red"
              type="button"
            >
              <span class="option-swatch swatch-red"></span>
              Red
            </button>

            <button
              class="option-btn color-option"
              data-color="random"
              type="button"
            >
              <span class="option-swatch swatch-random"></span>
              Random
            </button>

          </div>

        </div>

        <!-- DIFFICULTY -->

        <div class="setup-section">

          <h2 class="section-label">
            Choose difficulty
          </h2>

          <div class="option-row">

            <button
              class="option-btn difficulty-option"
              data-difficulty="easy"
              type="button"
            >
              Easy
            </button>

            <button
              class="option-btn difficulty-option"
              data-difficulty="medium"
              type="button"
            >
              Medium
            </button>

            <button
              class="option-btn difficulty-option"
              data-difficulty="hard"
              type="button"
            >
              Hard
            </button>

          </div>

        </div>

        <button
          id="start-btn"
          class="start-btn"
          type="button"
          disabled
        >
          Start Game
        </button>

      </section>

    </main>


    <!-- ===================== GAME ===================== -->

    <main
      id="game-screen"
      class="screen hidden"
    >

      <div class="game-wrap">

        <!-- HEADER -->

        <header class="game-header">

          <div>

            <p class="eyebrow">
              Classic board game
            </p>

            <h1 class="title small">
              Dots & Boxes
            </h1>

            <p
              id="status"
              class="status-text"
            >
              Your move
            </p>

          </div>

          <div class="header-right">

            <div class="score-panel">

              <div
                id="player-score-panel"
                class="score blue-score"
              >
                <span>You</span>
                <strong id="player-score">0</strong>
              </div>

              <div
                id="bot-score-panel"
                class="score red-score"
              >
                <span>Bot</span>
                <strong id="bot-score">0</strong>
              </div>

            </div>

            <button
              id="new-game-btn"
              class="ghost-btn"
              type="button"
            >
              New Game
            </button>

          </div>

        </header>


        <!-- BOARD -->

        <section class="board-frame">

          <div
            id="dots-board"
            class="dots-board"
          ></div>

        </section>

      </div>

    </main>


    <!-- ===================== TAPH ===================== -->

    <aside
      id="chat-panel"
      class="chat-panel hidden"
    >

      <div class="chat-header">

        <div class="taph-avatar">
          T
        </div>

        <div class="taph-info">

          <div class="taph-name">
            Taph
          </div>

          <div class="taph-status">

            <span class="online-dot"></span>

            Watching

          </div>

        </div>

      </div>


      <div
        id="chat-messages"
        class="chat-messages"
      >

        <div class="chat-message taph-message">

          <div class="message-avatar">
            T
          </div>

          <div class="message-bubble">
            👀
          </div>

        </div>

      </div>


      <div class="chat-input-area">

        <input
          id="chat-input"
          class="chat-input"
          type="text"
          maxlength="100"
          placeholder="Type a message..."
          autocomplete="off"
        >

        <button
          id="chat-send"
          class="chat-send"
          type="button"
        >
          ➤
        </button>

      </div>

    </aside>

  </div>


  <!-- ===================== GAME OVER ===================== -->

  <div
    id="game-over-overlay"
    class="overlay hidden"
  >

    <div class="overlay-card">

      <h2
        id="game-over-text"
        class="overlay-title"
      >
        You win!
      </h2>

      <p id="game-over-score">
        Final score
      </p>

      <button
        id="play-again-btn"
        class="start-btn"
        type="button"
      >
        Play Again
      </button>

    </div>

  </div>


  <script src="dotsboxes.js"></script>

</body>
</html>
