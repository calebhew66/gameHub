<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta
 name="description"
 content="A collection of browser games."
/>

  <title>Game Hub</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- ===== Header / Navigation ===== -->

  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">


  <a href="#top" class="nav__logo" aria-label="Game Hub home">
    CHgames
  </a>


  <ul class="nav__links">
    <li>
      <a href="#arcade">Arcade</a>
    </li>
  </ul>


  <button
    class="nav__theme-toggle"
    id="themeToggle"
    type="button"
    aria-label="Toggle dark mode"
    aria-pressed="false"
  >
    ◐
  </button>


</nav>


  </header>

  <main>


<!-- ===== Hero ===== -->
<section id="top" class="hero" aria-labelledby="hero-title">


  <div class="hero__content">


    <p class="hero__eyebrow">
      Game Hub
    </p>


    <h1 id="hero-title" class="hero__name">
      Play.
      <br />
      Have Fun.
    </h1>


    <p class="hero__tagline">
      A collection of games you can play right in your browser.
    </p>


    <div class="hero__actions">
      <a href="#games" class="btn btn--ghost">
        Browse Games
      </a>
    </div>


  </div>


</section>



<!-- ===== Games ===== -->
<section
  id="games"
  class="section"
  aria-labelledby="games-title"
>


  <header class="section__header">


    <p class="section__eyebrow">
      Collection
    </p>


    <h2 id="games-title" class="section__title">
      Games
    </h2>


  </header>



  <!-- ===== Game List ===== -->

  <div id="gameList">


    <!-- ===== Arcade Games ===== -->
    <section
      id="arcade"
      class="game-category"
      aria-labelledby="arcade-title"
    >


      <header class="category__header">
        <span class="category__number">01</span>


        <h3 id="arcade-title">
          Arcade
        </h3>
      </header>



      <div class="game-grid">


        <!-- ===== Chess ===== -->

        <button
          id="chessGameButton"
          class="game-card"
          type="button"
        >

          <span class="game-card__number">
            01
          </span>


          <div>

            <h4>
              Chess
            </h4>

            <p>
              Simple, play against bots of different difficultes.
            </p>

          </div>


          <span
            class="game-card__arrow"
            aria-hidden="true"
          >
            →
          </span>

        </button>



        <!-- ===== Game Four ===== -->

        <button
             id="ticTacToeGameButton"
              class="game-card"
              type="button"
          >
            <span class="game-card__number">
                    02
            </span>
      
           <div>
                 <h4>
                    Tic-Tac-Toe
          </h4>
      
          <p>
            Play Tic-Tac-Toe against a bot.
          </p>
        </div>
      
        <span
          class="game-card__arrow"
          aria-hidden="true"
        >
          →
        </span>
      </button>


      </div>


    </section>


  </div>



  <!-- ========================================
       CHESS GAME SCREEN
  ========================================= -->

  <section
    id="gameScreen"
    class="game-screen"
    aria-labelledby="gameScreenTitle"
    hidden
  >


    <!-- ===== Back Button ===== -->

    <button
      id="backToGames"
      class="back-button"
      type="button"
    >
      ← Back to Games
    </button>



    <!-- ===== Game Header ===== -->

    <header class="game-screen__header">

      <p class="section__eyebrow">
        Now playing
      </p>


      <h2
        id="gameScreenTitle"
        class="section__title"
      >
        Chess
      </h2>

    </header>



    <!-- ===== Chess Game ===== -->

    <div class="game-container">

      <iframe
        id="gameFrame"
        class="game-frame"
        src=""
        title="Chess game"
      ></iframe>

    </div>


  </section>


</section>


  </main>

  <!-- ===== Footer ===== -->

  <footer class="site-footer">


<p>
  &copy; <span id="year"></span> CHgames Game Hub.
</p>


  </footer>

  <script src="script.js"></script>

</body>
</html>
