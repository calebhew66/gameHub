<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="A collection of browser games."
  />

  <title>CHgames</title>

  <link
    rel="stylesheet"
    href="styles.css"
  />
</head>


<body>


  <!-- ========================================
       HEADER / NAVIGATION
  ========================================= -->

  <header class="site-header">

    <nav
      class="nav"
      aria-label="Main navigation"
    >

      <!-- LOGO -->

      <a
        href="#top"
        class="nav__logo"
        aria-label="Game Hub home"
      >
        CHgames
      </a>


      <!-- NAVIGATION LINKS -->

      <ul class="nav__links">

        <!-- CHANGE USERNAME -->

        <li>

          <button
            id="changeUsernameButton"
            class="nav__username-button"
            type="button"
          >
            Change Username
          </button>

        </li>


        <!-- ARCADE -->

        <li>

          <a href="#arcade">
            Arcade
          </a>

        </li>


        <!-- LEADERBOARD -->

        <li>

          <button
            id="leaderboardButton"
            class="nav__leaderboard-button"
            type="button"
            aria-controls="leaderboardPanel"
            aria-expanded="false"
          >
            Leaderboard
          </button>

        </li>

      </ul>


      <!-- THEME TOGGLE -->

      <button
        id="themeToggle"
        class="nav__theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        ◐
      </button>

    </nav>

  </header>



  <!-- ========================================
       LEADERBOARD OVERLAY
  ========================================= -->

  <div
    id="leaderboardOverlay"
    class="leaderboard-overlay"
    hidden
  ></div>



  <!-- ========================================
       LEADERBOARD PANEL
  ========================================= -->

  <aside
    id="leaderboardPanel"
    class="leaderboard-panel"
    aria-label="Leaderboard"
    aria-hidden="true"
  >

    <!-- HEADER -->

    <div class="leaderboard-panel__header">

      <div>

        <p class="leaderboard-panel__eyebrow">
          Rankings
        </p>

        <h2>
          Leaderboard
        </h2>

      </div>


      <button
        id="closeLeaderboard"
        class="leaderboard-panel__close"
        type="button"
        aria-label="Close leaderboard"
      >
        ×
      </button>

    </div>



    <!-- DESCRIPTION -->

    <div class="leaderboard-panel__description">

      <p>
        Top players ranked by total wins.
      </p>

    </div>



    <!-- COLUMNS -->

    <div class="leaderboard-panel__columns">

      <span>
        PLAYER
      </span>

      <span>
        WINS
      </span>

    </div>



    <!-- PLAYER LIST -->

    <div
      id="leaderboardList"
      class="leaderboard-panel__list"
    >

      <div class="leaderboard__loading">
        Loading leaderboard...
      </div>

    </div>

  </aside>



  <!-- ========================================
       MAIN
  ========================================= -->

  <main>


    <!-- ========================================
         HERO
    ========================================= -->

    <section
      id="top"
      class="hero"
      aria-labelledby="hero-title"
    >

      <div class="hero__content">

        <p class="hero__eyebrow">
          Game Hub
        </p>


        <h1
          id="hero-title"
          class="hero__name"
        >
          Play.
          <br />
          Have Fun.
        </h1>


        <p class="hero__tagline">
          A collection of games you can play right in your browser.
        </p>


        <div class="hero__actions">

          <a
            href="#games"
            class="btn btn--ghost"
          >
            Browse Games
          </a>

        </div>

      </div>

    </section>



    <!-- ========================================
         GAMES
    ========================================= -->

    <section
      id="games"
      class="section"
      aria-labelledby="games-title"
    >


      <!-- SECTION HEADER -->

      <header class="section__header">

        <p class="section__eyebrow">
          Collection
        </p>

        <h2
          id="games-title"
          class="section__title"
        >
          Games
        </h2>

      </header>



      <!-- ========================================
           GAME LIST
      ========================================= -->

      <div id="gameList">


        <!-- ========================================
             ARCADE
        ========================================= -->

        <section
          id="arcade"
          class="game-category"
          aria-labelledby="arcade-title"
        >


          <!-- CATEGORY HEADER -->

          <header class="category__header">

            <span class="category__number">
              01
            </span>

            <h3 id="arcade-title">
              Arcade
            </h3>

          </header>



          <!-- ========================================
               GAME GRID
          ========================================= -->

          <div class="game-grid">


            <!-- CHECKERS -->

            <button
              id="chessGameButton"
              class="game-card"
              type="button"
            >

              <span class="game-card__number">
                01
              </span>


              <div>

                <h4>
                  Checkers
                </h4>

                <p>
                  Simple, play against bots of different difficulties.
                </p>

              </div>


              <span
                class="game-card__arrow"
                aria-hidden="true"
              >
                →
              </span>

            </button>



            <!-- TIC-TAC-TOE -->

            <button
              id="ticTacToeGameButton"
              class="game-card"
              type="button"
            >

              <span class="game-card__number">
                02
              </span>


              <div>

                <h4>
                  Tic-Tac-Toe
                </h4>

                <p>
                  Play Tic-Tac-Toe against a bot.
                </p>

              </div>


              <span
                class="game-card__arrow"
                aria-hidden="true"
              >
                →
              </span>

            </button>



            <!-- CHESS -->

            <button
              id="chessGame3Button"
              class="game-card"
              type="button"
            >

              <span class="game-card__number">
                03
              </span>


              <div>

                <h4>
                  Chess
                </h4>

                <p>
                  Simple chess game against a bot.
                </p>

              </div>


              <span
                class="game-card__arrow"
                aria-hidden="true"
              >
                →
              </span>

            </button>



            <!-- DOTS & BOXES -->

            <button
              id="game4Button"
              class="game-card"
              type="button"
            >

              <span class="game-card__number">
                04
              </span>


              <div>

                <h4>
                  Dots &amp; Boxes
                </h4>

                <p>
                  Create more boxes than the bot!
                </p>

              </div>


              <span
                class="game-card__arrow"
                aria-hidden="true"
              >
                →
              </span>

            </button>


          </div>

        </section>

      </div>



      <!-- ========================================
           GAME SCREEN
      ========================================= -->

      <section
        id="gameScreen"
        class="game-screen"
        aria-labelledby="gameScreenTitle"
        hidden
      >


        <!-- BACK BUTTON -->

        <button
          id="backToGames"
          class="back-button"
          type="button"
        >
          ← Back to Games
        </button>



        <!-- GAME HEADER -->

        <header class="game-screen__header">

          <p class="section__eyebrow">
            Now playing
          </p>


          <h2
            id="gameScreenTitle"
            class="section__title"
          >
            Game
          </h2>

        </header>



        <!-- GAME -->

        <div class="game-container">

          <iframe
            id="gameFrame"
            class="game-frame"
            src=""
            title="Game"
          ></iframe>

        </div>


      </section>


    </section>

  </main>



  <!-- ========================================
       FOOTER
  ========================================= -->

  <footer class="site-footer">

    <p>

      &copy;

      <span id="year"></span>

      CHgames Game Hub.

    </p>

  </footer>



  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script
    type="module"
    src="script.js"
  ></script>


</body>

</html>
